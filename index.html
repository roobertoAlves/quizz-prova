<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz EDA2 – IFSP Guarulhos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card" id="quiz-container">
    <div class="header">
      <span class="badge">EDA2 – Estruturas de Dados 2</span>
      <p id="progresso">Questão 1 de 10</p>
      <div class="barra-outer"><div class="barra-inner" id="barra"></div></div>
    </div>

    <div id="tela-quiz">
      <p id="pergunta"></p>
      <ul id="alternativas"></ul>
      <div id="explicacao" class="hidden"></div>
      <button id="btn-proximo" disabled onclick="proximaPergunta()">Próxima Pergunta</button>
    </div>

    <div id="tela-resultado" class="hidden">
      <h2>Resultado Final</h2>
      <div class="stats">
        <div class="stat acertos"><span id="num-acertos">0</span><small>Acertos</small></div>
        <div class="stat erros"><span id="num-erros">0</span><small>Erros</small></div>
        <div class="stat pct"><span id="num-pct">0%</span><small>Aproveitamento</small></div>
      </div>
      <p id="mensagem-desempenho"></p>
      <button onclick="reiniciarQuiz()">Refazer Quiz</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
